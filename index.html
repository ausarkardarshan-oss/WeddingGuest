<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wedding Guest List Entry</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            background: white;
            width: 350px;
            margin: auto;
            padding: 25px;
            border: 1px solid #ccc;
        }

        h2 {
            text-align: center;
        }

        input[type="text"],
        input[type="number"] {
            width: 95%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            padding: 8px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Wedding Guest List Entry</h2>

    <form action="result.jsp" method="post">

        <label>Guest:</label><br>
        <input type="text" name="guest"
               maxlength="40" required>
        <br><br>

        <label>Side:</label><br>

        <input type="radio" name="side"
               value="Bride" required> Bride

        <input type="radio" name="side"
               value="Groom"> Groom
        <br><br>

        <label>Members:</label><br>
        <input type="number" name="members"
               min="1" max="10" required>
        <br><br>

        <label>City:</label><br>
        <input type="text" name="city"
               maxlength="30" required>
        <br><br>

        <button type="submit">Save</button>

    </form>

</div>

</body>
</html>
